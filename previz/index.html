<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Бесплатный редактор превиза: болванки, движение камеры и персонажей по тексту, запись видео для Seedance. Из курса Альберта Закирова «Нейропродакшн».">
<title>Превиз — редактор болванок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#111215;--panel:#191b1f;--panel2:#22252b;--panel3:#2a2e35;--line:#2d3038;--text:#e7e8eb;--muted:#8d919a;--accent:#f2c14e;--blue:#5ac8fa;--red:#ff5d5d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 Inter,system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto 48px minmax(0,1fr) 196px;grid-template-columns:212px minmax(0,1fr) 288px;height:100vh}
#top{grid-column:1/4;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.brand{font-weight:600;letter-spacing:.08em;font-size:12px;color:var(--accent);margin-right:6px;white-space:nowrap}
.brand span{color:var(--muted);font-weight:500;letter-spacing:.02em;margin-left:6px}
#left{grid-row:3;background:var(--panel);border-right:1px solid var(--line);overflow:auto}
#viewport{grid-row:3;position:relative;overflow:hidden;background:#0b0c0e}
#viewport canvas{display:block;touch-action:none}
#right{grid-row:3;background:var(--panel);border-left:1px solid var(--line);overflow:auto}
#bottom{grid-column:1/4;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.btn{height:30px;padding:0 10px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex-shrink:0;transition:background .12s,border-color .12s}
.btn:hover{background:var(--panel3)}
a.btn{color:var(--text);text-decoration:none}
a.btn.ai{color:#1a1405}
.btn.on{background:#3a3220;border-color:#8a6d2a;color:var(--accent)}
.btn.rec{background:#3a1d1d;border-color:#7d3030;color:#ffb4b4}
.btn.rec:hover{background:#4a2424}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1405;font-weight:600}
.btn.primary:hover{background:#ffd06a}
.btn.ghost{background:transparent}
.btn.small{height:26px;padding:0 8px;font-size:12px}
.btn.danger{color:#ffb4b4}
.btn svg{width:15px;height:15px;flex-shrink:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0}
.seg button{height:28px;border:0;background:var(--panel2);padding:0 10px;cursor:pointer;white-space:nowrap;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--panel3)}
.seg button.on{background:#3a3220;color:var(--accent)}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex-shrink:0}
.grow{flex:1}
select,input[type=text],input[type=number]{background:#131417;border:1px solid var(--line);color:var(--text);border-radius:6px;height:28px;padding:0 6px;font:inherit;min-width:0}
select{padding-right:4px;cursor:pointer}
#top select{flex-shrink:0;width:auto}
input[type=number]{font-family:'JetBrains Mono',monospace;font-size:12px;width:100%}
.xyz input[type=number]::-webkit-inner-spin-button,.xyz input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.xyz input[type=number]{-moz-appearance:textfield;appearance:textfield;padding:0 5px}
input:focus,select:focus{outline:none;border-color:#5b6170}
input[type=color]{width:34px;height:28px;padding:2px;border:1px solid var(--line);border-radius:6px;background:#131417;cursor:pointer;flex-shrink:0}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0;cursor:pointer}
.sec-title{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:12px 12px 8px;display:flex;align-items:center;gap:6px}
.prims{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 10px 6px}
.prim{height:56px;flex-direction:column;gap:5px;font-size:11px;padding:0;color:#c9ccd2}
.prim svg{width:22px;height:22px}
.prim:hover{color:#fff;border-color:#454a55}
.outl{padding-bottom:12px}
.oi{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;border-left:2px solid transparent;user-select:none}
.oi:hover{background:var(--panel2)}
.oi.sel{background:#262a31;border-left-color:var(--accent)}
.oi .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;box-shadow:inset 0 0 0 1px #0004}
.oi .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oi .kc{margin-left:auto;color:var(--muted);font-size:11px;font-family:'JetBrains Mono',monospace}
.ps{padding:10px 12px 12px;border-bottom:1px solid var(--line)}
.ph{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.ph b{color:var(--text);font-weight:600;text-transform:none;letter-spacing:0;font-size:13px}
.row{display:flex;align-items:center;gap:6px;margin:6px 0}
.row>.l{width:74px;flex-shrink:0;color:var(--muted);font-size:12px}
.row>.f{flex:1;min-width:0;display:flex;gap:6px;align-items:center}
.xyz{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;flex:1;min-width:0}
.ax0{box-shadow:inset 0 -2px 0 #e0574f}.ax1{box-shadow:inset 0 -2px 0 #6cc65b}.ax2{box-shadow:inset 0 -2px 0 #4f8fe0}
.axl{display:grid;grid-template-columns:74px repeat(3,1fr);gap:4px;font-size:10px;color:var(--muted);margin-top:-2px}
.axl span{text-align:center}
.sws{display:flex;gap:4px;flex-wrap:wrap}
.sw{width:19px;height:19px;border-radius:5px;cursor:pointer;box-shadow:inset 0 0 0 1px #0005;border:0;padding:0}
.sw:hover{transform:scale(1.12)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{height:24px;padding:0 8px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;display:inline-flex;align-items:center}
.chip:hover{background:var(--panel3)}
.chip.on{border-color:var(--accent);color:var(--accent)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.note{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:6px}
.note b{color:#c9ccd2;font-weight:500}
.kbd{font-family:'JetBrains Mono',monospace;font-size:10.5px;background:#262930;border:1px solid #363a43;border-bottom-width:2px;border-radius:4px;padding:0 4px;color:#cfd2d8}
#pip{position:absolute;border:1px solid var(--accent);border-radius:3px;cursor:pointer;display:none;box-shadow:0 6px 24px #0009}
#pip .tag{position:absolute;bottom:100%;left:-1px;margin-bottom:4px;font-size:10px;letter-spacing:.09em;color:var(--accent);white-space:nowrap;text-transform:uppercase;font-weight:600;background:rgba(17,18,21,.8);padding:3px 7px;border-radius:5px}
#pip:hover{border-color:#ffd77a}
#frame{position:absolute;pointer-events:none;display:none;box-shadow:0 0 0 9999px rgba(9,10,12,.74);outline:1px solid rgba(255,255,255,.35)}
#frame i{position:absolute;background:rgba(255,255,255,.22)}
#frame .v1{left:33.333%;top:0;bottom:0;width:1px}#frame .v2{left:66.666%;top:0;bottom:0;width:1px}
#frame .h1{top:33.333%;left:0;right:0;height:1px}#frame .h2{top:66.666%;left:0;right:0;height:1px}
#frame.nothirds i{display:none}
#vtag{position:absolute;left:10px;top:9px;font-size:11px;color:#dfe1e5;letter-spacing:.07em;text-transform:uppercase;pointer-events:none;font-weight:600;background:rgba(17,18,21,.72);padding:4px 8px;border-radius:6px}
#vtag span{color:var(--accent)}
#hint{position:absolute;left:10px;bottom:9px;max-width:calc(100% - 20px);font-size:11px;color:rgba(230,232,235,.8);pointer-events:none;line-height:1.75;background:rgba(17,18,21,.72);padding:3px 9px;border-radius:6px}
.tlbar{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tlbar::-webkit-scrollbar{display:none}
.tlbar label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;white-space:nowrap}
.tlbar input[type=number]{width:62px}
#timeLbl{font-family:'JetBrains Mono',monospace;font-size:12.5px;min-width:150px;white-space:nowrap}
#timeLbl span{color:var(--muted)}
#tlWrap{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;min-height:0}
#tl{display:block;cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.show{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:min(920px,96vw);max-height:94vh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px #000a}
.mbox h3{margin:0;font-size:15px;font-weight:600}
.mbox p{margin:0;color:#c3c6cc;line-height:1.5}
.mbox canvas,.mbox video{max-width:100%;max-height:62vh;background:#000;border-radius:6px;display:block;margin:0 auto}
.mrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.bar{height:4px;background:#2a2d33;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);width:0}
.steps{margin:0;padding-left:20px;color:#c3c6cc;line-height:1.6}
.steps li{margin:3px 0}
#toast{position:fixed;left:50%;bottom:214px;transform:translateX(-50%) translateY(6px);background:#2a2d33;border:1px solid #3a3e47;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:60;white-space:nowrap;box-shadow:0 8px 24px #0008}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--muted);font-size:12px;padding:4px 12px 10px}
#promo{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:7px 12px 7px 14px;background:linear-gradient(90deg,#2a2210 0%,#1b1a16 45%,#16171b 100%);border-bottom:1px solid #3a3220;min-height:40px;overflow:hidden}
#promo .pl{font-family:Unbounded,'Arial Black',sans-serif;font-weight:700;letter-spacing:.06em;font-size:12px;color:#f2a65e;white-space:nowrap}
#promo .pt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e9e4d6;font-size:13px}
#promo .pt b{font-weight:600;color:#fff}
#promo .pt span{color:#b9ae92}
#promo a.btn{text-decoration:none}
.lead{display:grid;gap:10px}
.lead label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.lead input[type=text],.lead select{height:36px;font-size:14px;padding:0 10px}
.lead .chk{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted);line-height:1.4}
.lead .chk input{margin-top:2px}
.pitch{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pitch div{background:#15171a;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px;color:#c3c6cc;line-height:1.4}
.pitch b{display:block;color:var(--accent);font-size:18px;font-weight:600;margin-bottom:2px}
.cta-line{display:flex;align-items:center;gap:10px;background:#211d12;border:1px solid #4a3d1c;border-radius:8px;padding:9px 12px;font-size:13px;color:#e9e4d6}
.cta-line .grow{flex:1}
textarea{width:100%;background:#131417;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;font:inherit;font-size:14px;line-height:1.5;resize:vertical;min-height:150px}
textarea:focus{outline:none;border-color:#5b6170}
.btn.ai{background:linear-gradient(180deg,#f5c95e,#e9b23c);border-color:#f2c14e;color:#1a1405;font-weight:600}
.btn.ai:hover{filter:brightness(1.07)}
.btn.mic.on{background:#3a1d1d;border-color:#c84a4a;color:#ffb4b4}
.pstatus{min-height:18px;font-size:12.5px;color:#c3c6cc}
.pstatus .partial{color:var(--muted);font-style:italic}
#dropHint{position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:12px;background:rgba(242,193,78,.08);display:none;align-items:center;justify-content:center;color:var(--accent);font-weight:600;font-size:15px;pointer-events:none}
#dropHint.show{display:flex}
#report{position:absolute;left:10px;top:44px;width:min(440px,calc(100% - 20px));background:rgba(20,21,25,.92);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:none;font-size:12.5px;line-height:1.45;box-shadow:0 8px 28px #0008;max-height:60%;overflow:auto}
#report.show{display:block}
#report .rh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#report .rh span{color:var(--muted);font-size:11.5px}
#report .rh button{margin-left:auto;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
#report ol{margin:0;padding-left:18px}
#report li{margin:2px 0}
#report li.bad{color:#ffb4b4}
#report .rf{color:var(--muted);font-size:11.5px;margin-top:6px}
details.cheat{background:#15171a;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12.5px;color:#c3c6cc}
details.cheat summary{cursor:pointer;color:var(--text);font-weight:500}
details.cheat .cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:8px}
details.cheat h4{margin:6px 0 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
details.cheat p{margin:0;line-height:1.55}
</style>

<body>
<div id="app">
  <div id="promo">
    <span class="pl">НЕЙРОПРОДАКШН</span>
    <div class="pt"><b>Курс Альберта Закирова</b> — продающие рекламные и fashion-ролики в нейросетях. Четыре недели, четыре ролика. <span>Редактор превиза — бесплатно, из инструментов курса.</span></div>
    <a class="btn small ghost" id="courseLink" href="#" target="_blank" rel="noopener">Программа курса →</a>
    <button class="btn small ai" id="leadBtn">Записаться</button>
  </div>
  <div id="top">
    <div class="brand">ПРЕВИЗ</div>
    <button class="btn ai" id="promptBtn" title="Собрать или изменить сцену по текстовому описанию">✦ Промпт</button>
    <div class="sep"></div>
    <div class="seg" id="modeSeg">
      <button data-mode="translate" title="Двигать (W)">Двигать</button>
      <button data-mode="rotate" title="Вращать (E)">Вращать</button>
      <button data-mode="scale" title="Масштаб (R)">Масштаб</button>
    </div>
    <div class="sep"></div>
    <div class="seg" id="viewSeg">
      <button data-view="editor" title="Свободный вид (C)">Редактор</button>
      <button data-view="shot" title="Вид из камеры кадра (C)">Камера</button>
    </div>
    <select id="aspectSel" title="Формат кадра">
      <option value="16:9">16:9</option><option value="9:16">9:16</option><option value="1:1">1:1</option><option value="4:5">4:5</option><option value="2.39:1">2.39:1</option>
    </select>
    <div class="sep"></div>
    <button class="btn" id="autokeyBtn" title="Автоключ: любое изменение сразу пишет ключ на текущем времени">● Автоключ</button>
    <button class="btn ghost" id="undoBtn" title="Отменить (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="btn ghost" id="redoBtn" title="Повторить (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    <div class="grow"></div>
    <button class="btn ghost" id="newBtn">Новая</button>
    <button class="btn ghost" id="openBtn">Открыть</button>
    <button class="btn ghost" id="saveBtn">Сохранить</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
    <input type="file" id="imgIn" accept="image/*" multiple hidden>
    <input type="file" id="bgIn" accept="image/*" hidden>
    <div class="sep"></div>
    <button class="btn" id="pngBtn" title="Сохранить текущий кадр из камеры в PNG">PNG</button>
    <button class="btn rec" id="recBtn" title="Записать превиз из камеры кадра в видео">● Запись</button>
    <button class="btn ghost" id="helpBtn" title="Как пользоваться">?</button>
  </div>

  <div id="left">
    <div class="sec-title">Добавить</div>
    <div class="prims" id="prims"></div>
    <div class="sec-title">Сцена</div>
    <div class="outl" id="outliner"></div>
  </div>

  <div id="viewport">
    <div id="pip"><div class="tag">Камера кадра</div></div>
    <div id="frame"><i class="v1"></i><i class="v2"></i><i class="h1"></i><i class="h2"></i></div>
    <div id="vtag"></div>
    <div id="hint"></div>
    <div id="report"></div>
    <div id="dropHint">Отпусти — картинка встанет в сцену</div>
  </div>

  <div id="right"></div>

  <div id="bottom">
    <div class="tlbar">
      <button class="btn small ghost" id="toStart" title="В начало (Home)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="btn small" id="playBtn" title="Плей / пауза (Пробел)" style="width:40px"></button>
      <button class="btn small ghost" id="toEnd" title="В конец (End)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <div id="timeLbl"></div>
      <div class="sep"></div>
      <label>Длительность <input type="number" id="durIn" min="0.5" max="120" step="0.5"> с</label>
      <label>FPS <select id="fpsSel"><option>24</option><option>25</option><option>30</option></select></label>
      <label><input type="checkbox" id="loopChk"> Повтор</label>
      <div class="sep"></div>
      <button class="btn small primary" id="keyBtn" title="Поставить ключ выделенному на текущем времени (K)">◆ Ключ</button>
      <button class="btn small" id="delKeyBtn" title="Удалить ключ на текущем времени">Удалить ключ</button>
      <div class="grow"></div>
      <span class="note" style="margin:0;white-space:nowrap">Ромбики можно перетаскивать по времени</span>
    </div>
    <div id="tlWrap"><canvas id="tl"></canvas></div>
  </div>
</div>

<div id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

const $ = s => document.querySelector(s);
const R2D = 180 / Math.PI, D2R = Math.PI / 180;
const ASPECTS = { '16:9': 16/9, '9:16': 9/16, '1:1': 1, '4:5': 4/5, '2.39:1': 2.39 };
const TYPES = { cube:'Куб', sphere:'Шар', cylinder:'Цилиндр', cone:'Конус', pyramid:'Пирамида', prism:'Призма', plane:'Плоскость', torus:'Тор', capsule:'Капсула', human:'Человек', car:'Авто', image:'Картинка' };
const PALETTE = ['#ececec','#f2c14e','#ef6f5e','#5ac8fa','#7ed37a','#b48cf2','#ff9f43','#f28cc2','#3f4452','#c9a27a'];
const INTERP = { smooth:'Разгон и торможение', in:'Только разгон', out:'Только торможение', flow:'Ровно, плавные стыки', linear:'Линейно' };
const ICONS = {

const PROMPT_RULES = `Ты — ассистент по превизу (previs). Переводишь словесное описание шота в JSON-сцену для простого 3D-редактора болванок. Сцена потом записывается как видео-превиз из камеры кадра.

СИСТЕМА КООРДИНАТ
- Метры. Ось Y вверх, пол y = 0. Держи сцену в пределах ±30 м от начала координат.
- pos объекта — точка на полу под центром его основания (у человека — между ступнями). Объекты стоят на полу: y = 0, если не летят/не стоят на чём-то.
- rot = [x, y, z] в градусах, порядок YXZ. rot y — поворот вокруг вертикали.
- При rot y = 0 человек и авто смотрят на +Z. rot y = 90 → на +X, 180 → на −Z, −90 → на −X. Если объект движется по направлению (dx, dz), ставь rot y = atan2(dx, dz) в градусах — чтобы шёл/ехал лицом вперёд.

ТИПЫ (размер при scale [1,1,1])
- human — манекен ростом 1.8 м
- car — легковое авто 1.85 × 1.4 × 4.4 м, длинная сторона по Z, нос в +Z
- cube 1×1×1 (стены, здания, столы, ящики — через scale), sphere Ø1, cylinder Ø1×1 (колонны, столбы), cone Ø1×1, pyramid ~1.4×1, prism (треугольная) Ø1.2×1, plane — вертикальный щит 2×2 лицом к +Z (баннер, экран, дверь), torus Ø1.3, capsule 1.6 м
- image — картинка, которую пользователь уже загрузил. Не создавай новые image; существующие оставляй с их id.

АНИМАЦИЯ
- У каждого объекта keys: [{"t": сек, "pos": [x,y,z], "rot": [x,y,z], "scale": [sx,sy,sz]}]. rot и scale можно опустить (по умолчанию [0,0,0] и [1,1,1]).
- Неподвижный объект — один ключ t = 0.
- Движущийся — первый ключ t = 0, дальше ключи по сюжету, последний обычно на duration. Для поворотов и смены направления добавляй промежуточные ключи.
- Реальные скорости: шаг 1.2–1.5 м/с, быстрый шаг 2 м/с, бег 3.5–6 м/с, авто в городе 5–14 м/с.
- interp: "smooth" — разгон и торможение; "in" — только разгон; "out" — только торможение; "flow" — ровно, без замедлений на краях, плавные стыки; "linear" — механически ровно. Для ходьбы, проходящей через весь шот, — "linear" или "flow".

КАМЕРА
- camera.keys: [{"t", "pos": [x,y,z], "focal": мм, "aim": [x,y,z]}]. pos — положение объектива.
- Высота: уровень глаз 1.5–1.7, низкий ракурс 0.3–0.8, верхний 3–6, дрон 10–40.
- focal: 14–24 широкий, 28–35 нормальный, 50 портрет, 85–135 сжатие/деталь. Можно менять между ключами (зум).
- camera.lookAt — id объекта для автотрекинга: камера всё время держит его в центре. Тогда aim не нужен. Используй lookAt, когда камера сопровождает героя.
- Без lookAt у каждого ключа камеры обязателен aim — точка, куда смотрит объектив.
- Облёт/дуга вокруг объекта: ключ на каждые 30–45° дуги, радиус постоянный (иначе путь срежет хорду). Облёт на 180° = минимум 5 ключей. Для непрерывного облёта interp "flow" или "smooth".
- Камера не должна проходить сквозь объекты и людей; держи дистанцию ≥ 0.8 м.
- Если просят «камера заходит сзади / огибает», вычисли точки на окружности вокруг героя с учётом того, что герой сам движется (центр дуги смещается вместе с ним в каждый момент t).

ПРОЧЕЕ
- aspect: "16:9", "9:16", "1:1", "4:5" или "2.39:1". Не указано — оставь текущий.
- duration в секундах (обычно 3–15).
- Цвета болванок: hex, разные для разных ролей (герой светлый #ececec, авто #5ac8fa, архитектура серые #3f4452/#9aa0a8, акценты #f2c14e/#ef6f5e).
- name — короткое имя по-русски.
- Будь физически правдоподобен: люди стоят на полу, не проходят сквозь стены, авто едет носом вперёд, двери/проходы шириной ≥ 1 м.
- Если в запросе чего-то не хватает, прими разумное режиссёрское решение и коротко скажи о нём в note.

ФОРМАТ ОТВЕТА — только один JSON-объект, без пояснений и без markdown:
{"note":"1–2 предложения по-русски: что построено и какие решения принял","duration":6,"aspect":"16:9","objects":[{"id":"hero","type":"human","name":"Героиня","color":"#ececec","interp":"linear","keys":[{"t":0,"pos":[0,0,-4],"rot":[0,0,0]},{"t":6,"pos":[0,0,4],"rot":[0,0,0]}]},{"id":"wall","type":"cube","name":"Стена","color":"#3f4452","keys":[{"t":0,"pos":[0,0,-9],"scale":[14,4,0.4]}]}],"camera":{"lookAt":"hero","interp":"smooth","keys":[{"t":0,"pos":[0,1.6,4],"focal":35},{"t":6,"pos":[0,1.5,9],"focal":50}]}}`;

const r2 = v => Math.round(v * 100) / 100;
const r2a = a => a.map(r2);
function aimFromRot(pos, rot) {
  const e = new THREE.Euler(rot[0] * D2R, rot[1] * D2R, rot[2] * D2R, 'YXZ');
  const f = new THREE.Vector3(0, 0, -1).applyEuler(e).multiplyScalar(5);
  return [pos[0] + f.x, pos[1] + f.y, pos[2] + f.z];
}
function sceneToSpec() {
  const objs = [...objects.values()].map(o => {
    const ks = o.keys.length ? o.keys : [{ t:0, ...objPose(o) }];
    return { id:o.id, type:o.type, name:o.name, color:o.color, interp:o.interp, keys:ks.map(k => ({ t:r2(k.t), pos:r2a(k.pos), rot:r2a(k.rot), scale:r2a(k.scl) })) };
  });
  const ck = cam.keys.length ? cam.keys : [{ t:0, ...camPose() }];
  return { duration:settings.duration, aspect:settings.aspect, objects:objs,
    camera:{ lookAt:cam.lookAt, interp:cam.interp, keys:ck.map(k => ({ t:r2(k.t), pos:r2a(k.pos), focal:r2(k.focal), aim:r2a(aimFromRot(k.pos, k.rot)) })) } };
}
const num = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : (isFinite(parseFloat(v)) ? parseFloat(v) : d);
const vec3 = (v, d) => Array.isArray(v) && v.length >= 3 ? [num(v[0], d[0]), num(v[1], d[1]), num(v[2], d[2])] : d.slice();

  if (!Array.isArray(spec.objects)) throw new Error('В ответе нет списка objects');
  const dur = Math.max(0.5, Math.min(120, num(spec.duration, settings.duration)));
  const aspect = ASPECTS[spec.aspect] ? spec.aspect : settings.aspect;
  const fps = settings.fps, half = 0.5 / fps;
  const prev = new Map([...objects.values()].map(o => [o.id, o]));
  const used = new Set(), outObjs = [];
  for (const s of spec.objects) {
    if (!s || typeof s !== 'object') continue;
    let type = TYPES[s.type] ? s.type : 'cube';
    let id = String(s.id || type).replace(/[^\w\-]/g, '').slice(0, 40) || type;
    while (used.has(id)) id += '_';
    used.add(id);
    const extra = {};
    if (type === 'image') {
      const old = prev.get(id);
      if (!old || old.type !== 'image' || !images[old.img]) continue;
      Object.assign(extra, { img:old.img, imgAspect:old.imgAspect, billboard:old.billboard });
    }
    let keys = (Array.isArray(s.keys) ? s.keys : []).filter(k => k && typeof k === 'object').map(k => ({
      t:Math.max(0, Math.min(dur, Math.round(num(k.t, 0) * fps) / fps)),
      pos:vec3(k.pos, [0, 0, 0]), rot:vec3(k.rot, [0, 0, 0]), scl:vec3(k.scale || k.scl, [1, 1, 1]).map(v => Math.abs(v) < 0.01 ? 0.01 : v)
    })).sort((a, b) => a.t - b.t);
    keys = keys.filter((k, i) => i === 0 || Math.abs(k.t - keys[i - 1].t) >= half);
    if (!keys.length) keys = [{ t:0, pos:vec3(s.pos, [0, 0, 0]), rot:vec3(s.rot, [0, 0, 0]), scl:vec3(s.scale, [1, 1, 1]) }];
    const base = keys[0];
    outObjs.push({ id, type, name:String(s.name || TYPES[type]).slice(0, 40),
      color:/^#[0-9a-f]{6}$/i.test(s.color || '') ? s.color : (type === 'image' ? '#ffffff' : PALETTE[outObjs.length % PALETTE.length]),
      interp:INTERP[s.interp] ? s.interp : 'smooth', keys:keys.length > 1 ? keys : [], pos:base.pos, rot:base.rot, scl:base.scl, ...extra });
  }
  for (const o of prev.values()) if (o.type === 'image' && !used.has(o.id) && images[o.img]) {
    used.add(o.id);
    outObjs.push({ id:o.id, type:'image', name:o.name, color:o.color, interp:o.interp, keys:o.keys, ...objPose(o), img:o.img, imgAspect:o.imgAspect, billboard:o.billboard });
  }

  const sc = spec.camera && typeof spec.camera === 'object' ? spec.camera : {};

  const tmp = new THREE.PerspectiveCamera(); tmp.rotation.order = 'YXZ';
  const targetAt = (t) => {
    const o = outObjs.find(x => x.id === lookAt); if (!o) return [0, 1, 0];
    const p = o.keys.length ? evalTrack(o.keys, t, o.interp, ['pos']).pos : o.pos;
    return [p[0], p[1] + (o.type === 'human' ? 1.2 : o.type === 'car' ? 0.8 : 0.5), p[2]];
  };
  let ckeys = (Array.isArray(sc.keys) ? sc.keys : []).filter(k => k && typeof k === 'object').map(k => {
    const t = Math.max(0, Math.min(dur, Math.round(num(k.t, 0) * fps) / fps));
    const pos = vec3(k.pos, [0, 1.6, 6]);
    const aim = lookAt ? targetAt(t) : vec3(k.aim || k.lookAtPoint || k.target, [0, 1, 0]);

    return { t, pos, rot:[tmp.rotation.x * R2D, tmp.rotation.y * R2D, tmp.rotation.z * R2D], focal:Math.max(8, Math.min(400, num(k.focal, cam.focal || 35))) };
  }).sort((a, b) => a.t - b.t);
  ckeys = ckeys.filter((k, i) => i === 0 || Math.abs(k.t - ckeys[i - 1].t) >= half);
  for (let i = 1; i < ckeys.length; i++) ckeys[i].rot = ckeys[i].rot.map((v, c) => v + 360 * Math.round((ckeys[i - 1].rot[c] - v) / 360));

  load({ settings:{ ...settings, duration:dur, aspect }, idSeq, cam:camData, objects:outObjs });

}

      for (let i = 0; i <= steps; i++) { const u = i / steps, t = t0 + a.dur * u; addCamKey(t, C0.pos, aimRot(C0.pos, aimAt(t)), C0.focal); }
      label = `стоит и следит за «${M.name}»`; trackTarget = M;
    } else if (isHold || a.placed || (a !== firstCam && placement(s, M, t0, true))) {
      addCamKey(t0, C0.pos, M ? aimRot(C0.pos, aimAt(t0)) : C0.rot, C0.focal); addCamKey(t1, C0.pos, M ? aimRot(C0.pos, aimAt(t0)) : C0.rot, C0.focal);
      label = a.placed ? 'стоит в стартовой точке' : 'стоит';
      if (M && !/статичн|не следит/.test(s)) trackTarget = trackTarget || M;
    } else { unknown.push(s.trim()); continue; }
    if (f1 !== f0 && !/зум/.test(label)) label += `, ${Math.round(f0)}→${Math.round(f1)} мм`;
    report.push(`Камера: ${label} · ${t0.toFixed(1)}–${t1.toFixed(1)} с`);
  }
  }
  if (camActs.length) {
    cam.lookAt = (!usePan && trackTarget) ? trackTarget.id : null;
    if (cam.keys.length < 2) { const k = cam.keys[0]; if (k) setCamPose(k); cam.keys = []; }
    else setCamPose(cam.keys[0]);
  }
  if (!camActs.length && created.length && !cam.lookAt) cam.lookAt = created[0];
  return { ok:report.length > 0, report, unknown, D, aspect };
}
function showReport(res) {
  const el = $('#report');
  const lines = res.report.map(l => `<li>${esc(l)}</li>`).join('') + res.unknown.map(u => `<li class="bad">Не понял: «${esc(u)}»</li>`).join('');
  el.innerHTML = `<div class="rh"><b>Понял так</b><span>${(+settings.duration).toFixed(1)} с · ${settings.aspect}</span><button data-x>×</button></div><ol>${lines}</ol><div class="rf">Не то? Поправь текст и разбери снова, или <span class="kbd">Ctrl+Z</span>.</div>`;
  el.classList.add('show');
  el.querySelector('[data-x]').onclick = () => el.classList.remove('show');
}
function runDirect() {
  const ta = $('#ptext'); if (!ta) return;
  const raw = ta.value.trim();
  if (!raw) { setPStatus('Опиши шот — или вставь JSON.'); return; }
  const direct = tryParseJSON(ta.value);
  if (direct) { try { applySpec(direct); hideModal(); toast(direct.note ? String(direct.note).slice(0, 140) : 'Сцена применена'); playing = true; syncUiButtons(); } catch (e) { setPStatus('JSON не подошёл: ' + esc(e.message || 'ошибка формата')); } return; }
  let res;
  try { res = directText(raw, ui.pmode); }
  catch (e) { console.error(e); setPStatus('Не получилось разобрать — попробуй проще, по одному действию в предложении.'); return; }
  if (!res.ok) { setPStatus('Не нашёл действий. Пример: «Девушка идёт на камеру 6 секунд. Камера облетает её слева и заходит за спину.»'); return; }
  time = 0; playing = false;
  applySettings(); applyTime(0);
  select(null); commit(); setTime(0);
  hideModal(); showReport(res);
  playing = true; syncUiButtons();
}
